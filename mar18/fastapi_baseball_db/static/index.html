<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Teams by Year</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Baseball History</h1>

        <!-- Year selector -->
        <p>Select a year to see all the teams:</p>
        <select id="year-dropdown">
            <option>Loading years...</option>
        </select>

        <!-- Teams grouped by league/division -->
        <div id="teams-list" class="info-box"></div>

        <!-- Players list -->
        <div id="players-list" class="info-box"></div>

        <!-- Player info -->
        <div id="player-info" class="info-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
