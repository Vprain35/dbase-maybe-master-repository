<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Fun!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Number Fun!</h1>
        <div class="problem-display">
            <p>Solve this multiplication problem:</p>
            <div id="problem" class="problem">Loading...</div>
        </div>
        <div class="answer-section">
        <input type="number" id="answer-input" placeholder="Your answer" class="answer-input">
        <button id="check-answer-btn" class="check-button">Check Answer</button>
        <button id="reveal-answer-btn" class="reveal-button">Reveal Answer</button>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="new-problem-btn" class="fun-button">New Problem!</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
